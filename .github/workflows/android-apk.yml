name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Build web (produção)
        run: npm run build

      - name: Remover server.url (build offline/produção)
        run: |
          node -e "
            const fs=require('fs');
            const p='capacitor.config.ts';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace(/\s*server:\s*\{[^}]*\},/s,'');
            fs.writeFileSync(p,s);
          "

      - name: Adicionar plataforma Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Decodificar keystore
        if: ${{ github.event.inputs.build_type != 'debug' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/arrow.keystore

      - name: Build APK assinado
        if: ${{ github.event.inputs.build_type != 'debug' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/arrow.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build APK debug
        if: ${{ github.event.inputs.build_type == 'debug' || secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: arrow-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
