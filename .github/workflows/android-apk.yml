name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      native_build:
        description: "Número do build nativo (incrementar quando algo nativo mudar)"
        required: true
        default: "1"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # `secrets` não é acessível em `if:` de step — resolvemos aqui via env + output.
      - name: Detectar keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ "${{ inputs.build_type }}" = "release" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Build web (produção)
        env:
          BUNDLE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
          NATIVE_BUILD: ${{ inputs.native_build }}
        run: npm run build

      - name: Remover server.url (build offline/produção)
        run: |
          node -e "
            const fs=require('fs');
            const p='capacitor.config.ts';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace(/\s*server:\s*\{[^}]*\},/s,'');
            fs.writeFileSync(p,s);
          "

      - name: Adicionar plataforma Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Decodificar keystore
        if: steps.keystore.outputs.mode == 'release'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/arrow.keystore

      - name: Build APK assinado (release)
        if: steps.keystore.outputs.mode == 'release'
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/arrow.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      # APK debug é assinado automaticamente pelo Gradle com a debug keystore do
      # runner (efêmero) — pode exigir desinstalar a versão anterior antes de instalar.
      - name: Build APK debug
        if: steps.keystore.outputs.mode == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: arrow-android-${{ steps.keystore.outputs.mode }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
